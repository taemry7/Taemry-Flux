<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Teal Squircle -->
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5c6e" />
      <stop offset="50%" stop-color="#094553" />
      <stop offset="100%" stop-color="#052c36" />
    </linearGradient>

    <!-- Metallic Brushed Silver Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="75%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Circuit Glowing Traces Gradient -->
    <linearGradient id="circuitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#02161c" flood-opacity="0.5" />
    </filter>
    
    <filter id="metalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#021a22" flood-opacity="0.8" />
    </filter>

    <!-- Grid Pattern overlay -->
    <pattern id="microGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Squircle Base with Soft Shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#squircleBg)" filter="url(#softShadow)" />
  
  <!-- Subtle Grid texture -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#microGrid)" />

  <!-- Inner Top Rim Highlight -->
  <rect x="34" y="34" width="444" height="444" rx="110" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2.5" />

  <!-- "TF" Monogram in 3D Metallic Style with Circuit Tracks -->
  <g filter="url(#metalShadow)">
    <!-- T top bar -->
    <path d="M 130 180 C 130 160 170 145 220 140 L 225 175 C 190 180 170 190 160 215 L 130 215 Z" fill="url(#metalGrad)" />

    <!-- Main Stem of T flowing into F -->
    <path d="M 220 140 C 235 155 240 185 240 230 C 240 280 235 320 270 340 C 290 352 300 375 285 405 C 275 425 255 425 235 410 C 205 385 190 325 185 270 C 180 215 190 165 220 140 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />

    <!-- Circuit traces inside T stem -->
    <path d="M 205 200 C 205 250 210 300 230 340" fill="none" stroke="url(#circuitGlow)" stroke-width="4.5" stroke-linecap="round" />
    <circle cx="205" cy="195" r="4.5" fill="#38bdf8" />
    <circle cx="230" cy="340" r="4.5" fill="#c084fc" />

    <path d="M 220 175 C 225 230 225 280 250 330" fill="none" stroke="url(#circuitGlow)" stroke-width="3" stroke-linecap="round" />
    <circle cx="250" cy="330" r="3.5" fill="#34d399" />

    <!-- Upper F branch -->
    <path d="M 270 170 C 310 165 370 165 400 195 C 405 200 400 210 390 212 L 310 215 C 285 215 270 200 270 170 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />
    <path d="M 290 190 L 375 190" fill="none" stroke="url(#circuitGlow)" stroke-width="4" stroke-linecap="round" />
    <circle cx="375" cy="190" r="4" fill="#38bdf8" />

    <!-- Middle F branch -->
    <path d="M 265 235 C 300 235 340 235 365 255 C 370 260 365 270 355 272 L 285 272 C 265 272 260 255 265 235 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />
    <path d="M 285 253 L 340 253" fill="none" stroke="url(#circuitGlow)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="340" cy="253" r="3.5" fill="#c084fc" />

    <!-- Lower swoosh connector -->
    <path d="M 268 285 C 305 310 345 320 370 360 C 380 375 365 385 345 385 C 320 385 295 350 275 330 Z" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />
    <path d="M 295 330 C 315 345 330 355 350 365" fill="none" stroke="url(#circuitGlow)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="350" cy="365" r="4" fill="#34d399" />
  </g>
</svg>
