  <head>

    <meta name="description" content="Reward-based advertising platform featuring daily views, packages, wallet tracking, and secure Firebase authentication." />
    <meta property="og:title" content="TAEMRY FLUX" />
    <meta property="og:description" content="Reward-based advertising platform featuring daily views, packages, wallet tracking, and secure Firebase authentication." />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      (function() {
        try {
          // Intercept vite-hmr websocket in cloud container preview where port 24678 is not exposed
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWebSocket = window.WebSocket;
            var MockWebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('token=') !== -1))) {
                var target = new EventTarget();
                target.url = url;
                target.protocol = 'vite-hmr';
                target.readyState = 1; // WebSocket.OPEN
                target.send = function() {};
                target.close = function() {
                  target.readyState = 3;
                };
                setTimeout(function() {
                  try {
                    target.dispatchEvent(new Event('open'));
                  } catch (err) {}
                }, 5);
                return target;
              }
              return new OrigWebSocket(url, protocols);
            };
            MockWebSocket.prototype = OrigWebSocket.prototype;
            MockWebSocket.CONNECTING = 0;
            MockWebSocket.OPEN = 1;
            MockWebSocket.CLOSING = 2;
            MockWebSocket.CLOSED = 3;
            window.WebSocket = MockWebSocket;
          }

          // Filter benign [vite] HMR connection logs in container preview
          var filterViteMsg = function(args) {
            for (var i = 0; i < args.length; i++) {
              var arg = args[i];
              if (typeof arg === 'string' && arg.indexOf('[vite]') !== -1) return true;
              if (arg && typeof arg === 'object') {
                if (arg.message && typeof arg.message === 'string' && arg.message.indexOf('[vite]') !== -1) return true;
                if (arg.reason && typeof arg.reason === 'string' && arg.reason.indexOf('[vite]') !== -1) return true;
                if (arg.stack && typeof arg.stack === 'string' && arg.stack.indexOf('[vite]') !== -1) return true;
              }
            }
            return false;
          };

          var origError = console.error;
          console.error = function() {
            if (filterViteMsg(arguments)) return;
            origError.apply(console, arguments);
          };
          var origWarn = console.warn;
          console.warn = function() {
            if (filterViteMsg(arguments)) return;
            origWarn.apply(console, arguments);
          };
          var origInfo = console.info;
          console.info = function() {
            if (filterViteMsg(arguments)) return;
            origInfo.apply(console, arguments);
          };

          window.addEventListener('unhandledrejection', function(e) {
            if (filterViteMsg([e, e.reason])) {
              e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }, true);

          window.addEventListener('error', function(e) {
            if (filterViteMsg([e, e.message, e.error])) {
              e.preventDefault();
              if (e.stopPropagation) e.stopPropagation();
              if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            }
          }, true);

          var saved = localStorage.getItem('taemry_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.body && document.body.classList.add('dark');
          }
          // Immediate referral code capture from URL (?ref=CODE or #/?ref=CODE) into localStorage
          var searchParams = new URLSearchParams(window.location.search);
          var ref = searchParams.get('ref') || searchParams.get('referral');
          if (!ref && window.location.hash) {
            var hashMatch = window.location.hash.match(/[?&]ref=([^&#]+)/i);
            if (hashMatch && hashMatch[1]) {
              ref = hashMatch[1];
            }
          }
          if (ref) {
            var cleanRef = decodeURIComponent(ref).trim();
            localStorage.setItem('referralCode', cleanRef);
            // If opening via referral link, route directly to sign up page
            if (!window.location.hash || window.location.hash === '#' || window.location.hash === '#/' || window.location.hash === '#/home' || window.location.hash.indexOf('?') !== -1) {
              window.location.hash = '#/login/signup?ref=' + encodeURIComponent(cleanRef);
            }
          }

          // Service Worker registration for PWA installability
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('/sw.js').catch(function(err) {
                console.warn('[PWA SW Registration]:', err);
              });
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#faf8f5] text-[#132e35] antialiased selection:bg-[#0c5963] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
