    <script>
      (function() {
        try {
          var saved = localStorage.getItem('taemry_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.body && document.body.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
